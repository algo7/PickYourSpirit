<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- PickYourSpirit icon: original line drawing of a picker, two arrows around a solid paw print (pick the next spirit
       animal), glowing spirit violet (#b98cff), on the round wooden shield of the author's LoadoutBuffs, SealsAtHome and
       DvergrForHire icons. Rendered to icon.png with cairosvg (1024 px, then LANCZOS down to 256). -->
  <defs>
    <clipPath id="wood"><circle cx="128" cy="128" r="96"/></clipPath>
    <radialGradient id="shade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="44" fill="#1c2128"/>
  <circle cx="128" cy="128" r="108" fill="#808c98"/>
  <circle cx="128" cy="128" r="96" fill="#704c2e"/>
  <g clip-path="url(#wood)" stroke="#593c26" stroke-width="3">
    <path d="M 48 20 V 236 M 72 20 V 236 M 96 20 V 236 M 120 20 V 236 M 144 20 V 236 M 168 20 V 236 M 192 20 V 236 M 216 20 V 236"/>
  </g>
  <circle cx="128" cy="128" r="96" fill="url(#shade)"/>
  <g transform="translate(128 128)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g id="chev"><path d="M -70.6 -22 L -86.0 0 L -70.6 22"/><path d="M 70.6 -22 L 86.0 0 L 70.6 22"/></g>
    <use href="#chev" stroke="#b98cff" stroke-width="26" stroke-opacity="0.12"/>
    <use href="#chev" stroke="#b98cff" stroke-width="18" stroke-opacity="0.22"/>
    <use href="#chev" stroke="#b98cff" stroke-width="9"/>
  </g>
  <g transform="translate(128 137)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g id="paw"><ellipse cx="0" cy="10.5" rx="19.9" ry="15.8" fill="#b98cff"/><ellipse cx="-40.8" cy="-15.4" rx="5.8" ry="7.9" transform="rotate(-62 -40.8 -15.4)" fill="#b98cff"/><ellipse cx="-18.1" cy="-36.2" rx="5.8" ry="7.9" transform="rotate(-23 -18.1 -36.2)" fill="#b98cff"/><ellipse cx="18.1" cy="-36.2" rx="5.8" ry="7.9" transform="rotate(23 18.1 -36.2)" fill="#b98cff"/><ellipse cx="40.8" cy="-15.4" rx="5.8" ry="7.9" transform="rotate(62 40.8 -15.4)" fill="#b98cff"/></g>
    <use href="#paw" stroke="#b98cff" stroke-width="26" stroke-opacity="0.12"/>
    <use href="#paw" stroke="#b98cff" stroke-width="18" stroke-opacity="0.22"/>
    <use href="#paw" stroke="#b98cff" stroke-width="9"/>
  </g>
</svg>
